name: Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Mavzu raqami (1-30). Bo'sh qolsa navbatdagisi"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg o'rnatish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1
          python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow

      - name: Reel yasash
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: python3 scripts/make_reel.py

      - name: Natijani saqlash
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/
          retention-days: 3

      - name: Navbatni repoga yozish
        run: |
          git config user.name "homzie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "Reel ${{ github.run_number }}: navbat yangilandi" || echo "o'zgarish yo'q"
          git push

      - name: Xulosa
        if: always()
        run: |
          if [ -f out/info.json ]; then
            echo "## Reel ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat out/caption.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
